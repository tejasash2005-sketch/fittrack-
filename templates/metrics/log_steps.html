{% extends 'base.html' %}
{% block title %}Log Steps{% endblock %}
{% block page_title %}👟 Step Counter{% endblock %}
{% block content %}
<div style="max-width:500px;" class="fade-up">
  <div class="card">
    <div class="card-header-ft">
      <div class="card-title-ft"><i class="bi bi-person-walking" style="color:var(--green);"></i> Log Daily Steps</div>
      <a href="{% url 'metrics:dashboard' %}" class="btn-ft btn-secondary-ft btn-sm-ft"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
    <div class="card-body-ft">
      <form method="post">
        {% csrf_token %}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">
          <div style="grid-column:1/-1;"><label class="form-label-ft">STEP COUNT *</label><input type="number" name="steps" class="form-ctrl" placeholder="8000" min="0" required style="font-size:24px;font-family:var(--font-display);height:60px;"></div>
          <div><label class="form-label-ft">DISTANCE (km)</label><input type="number" name="distance" class="form-ctrl" placeholder="5.5" step="0.01" min="0"></div>
          <div><label class="form-label-ft">CALORIES BURNED</label><input type="number" name="calories" class="form-ctrl" placeholder="250" step="0.1" min="0"></div>
          <div><label class="form-label-ft">ACTIVE MINUTES</label><input type="number" name="active_minutes" class="form-ctrl" placeholder="45" min="0"></div>
        </div>
        <button type="submit" class="btn-ft btn-primary-ft" style="width:100%;justify-content:center;"><i class="bi bi-person-walking"></i> Log Steps</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
