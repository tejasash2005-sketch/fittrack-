{% extends 'base.html' %}

{% block title %}Nutrition Goals{% endblock %}
{% block page_title %}🎯 Nutrition Goals{% endblock %}

{% block content %}
<div style="max-width:600px;" class="fade-up">
  <div class="card">

    <div class="card-header-ft">
      <div class="card-title-ft">
        <i class="bi bi-bullseye" style="color:var(--accent2);"></i>
        Set Daily Nutrition Goals
      </div>
    </div>

    <div class="card-body-ft">
      <form method="post">
        {% csrf_token %}

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">

          <div>
            <label class="form-label-ft">DAILY CALORIES (kcal)</label>
            <input type="number" name="daily_calories" class="form-ctrl"
                   value="{{ goal.daily_calories|default:0 }}">
          </div>

          <div>
            <label class="form-label-ft">PROTEIN (g)</label>
            <input type="number" name="daily_protein" class="form-ctrl"
                   value="{{ goal.daily_protein|default:0 }}" step="0.1">
          </div>

          <div>
            <label class="form-label-ft">CARBOHYDRATES (g)</label>
            <input type="number" name="daily_carbs" class="form-ctrl"
                   value="{{ goal.daily_carbs|default:0 }}" step="0.1">
          </div>

          <div>
            <label class="form-label-ft">FAT (g)</label>
            <input type="number" name="daily_fat" class="form-ctrl"
                   value="{{ goal.daily_fat|default:0 }}" step="0.1">
          </div>

          <div>
            <label class="form-label-ft">FIBER (g)</label>
            <input type="number" name="daily_fiber" class="form-ctrl"
                   value="{{ goal.daily_fiber|default:0 }}" step="0.1">
          </div>

          <div>
            <label class="form-label-ft">WATER (ml)</label>
            <input type="number" name="daily_water_ml" class="form-ctrl"
                   value="{{ goal.daily_water_ml|default:0 }}" step="50">
          </div>

        </div>

        <button type="submit" class="btn-ft btn-primary-ft">
          <i class="bi bi-check-circle-fill"></i> Update Goals
        </button>

      </form>
    </div>

  </div>
</div>
{% endblock %}
